<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" />
    </marker>
  </defs>

  <rect width="1180" height="680" fill="#ffffff" />

  <!-- Title -->
  <text x="20" y="30" font-size="18" font-weight="700" fill="#222">co-applai pipeline</text>

  <!-- onlinejobsph-scraper boundary (mapper + parser are its two services) -->
  <rect x="20" y="60" width="440" height="130" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5" />
  <text x="36" y="80" font-size="13" font-weight="700" fill="#4b5563">onlinejobsph-scraper (GitHub Actions)</text>

  <!-- mapper -->
  <g>
    <rect x="36" y="92" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
    <image href="data:image/svg+xml;base64," x="50" y="104" width="24" height="24" />
    <text x="82" y="121" font-size="13" font-weight="600" fill="#222">mapper</text>
    <text x="50" y="140" font-size="11" fill="#57606a">fetches raw job HTML</text>
  </g>

  <!-- parser -->
  <g>
    <rect x="254" y="92" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />
    <image href="data:image/svg+xml;base64," x="268" y="104" width="24" height="24" />
    <text x="300" y="121" font-size="13" font-weight="600" fill="#222">parser</text>
    <text x="268" y="140" font-size="11" fill="#57606a">parses HTML -&gt; fields</text>
  </g>

  <line x1="226" y1="132" x2="252" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Supabase -->
  <g>
    <rect x="490" y="92" width="190" height="100" rx="10" fill="#f0fdf4" stroke="#3fcf8e" stroke-width="1.5" />
    <image href="data:image/svg+xml;base64," x="505" y="106" width="26" height="26" />
    <text x="538" y="124" font-size="14" font-weight="600" fill="#222">Supabase</text>
    <text x="505" y="146" font-size="12" fill="#2f855a">jobs</text>
    <text x="505" y="162" font-size="12" fill="#2f855a">letters / llm_calls / tool_calls</text>
  </g>

  <!-- arrow from scraper boundary to supabase -->
  <line x1="460" y1="130" x2="488" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- arrow down from supabase to co-applai backend -->
  <line x1="585" y1="192" x2="585" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- co-applai docker compose boundary -->
  <rect x="40" y="235" width="1100" height="330" rx="14" fill="none" stroke="#8957e5" stroke-width="2" stroke-dasharray="6,5" />
  <g>
    <image href="data:image/svg+xml;base64," x="56" y="246" width="22" height="22" />
    <text x="84" y="262" font-size="13" font-weight="700" fill="#8957e5">co-applai (docker compose)</text>
  </g>

  <!-- backend box -->
  <rect x="70" y="280" width="620" height="260" rx="10" fill="#fff7ed" stroke="#f0883e" stroke-width="1.5" />
  <g>
    <image href="data:image/svg+xml;base64," x="86" y="292" width="24" height="24" />
    <text x="116" y="310" font-size="14" font-weight="700" fill="#222">backend (FastAPI)</text>
  </g>

  <!-- LangGraph box -->
  <rect x="100" y="330" width="260" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="116" y="352" font-size="13" font-weight="700" fill="#4338ca">LangGraph StateGraph</text>

  <g>
    <rect x="116" y="368" width="100" height="36" rx="6" fill="#ffffff" stroke="#6366f1" />
    <text x="128" y="391" font-size="12" fill="#222">Discovery</text>
  </g>
  <line x1="216" y1="386" x2="236" y2="386" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="236" y="368" width="100" height="36" rx="6" fill="#ffffff" stroke="#6366f1" />
    <text x="252" y="391" font-size="12" fill="#222">Matcher</text>
  </g>

  <line x1="166" y1="404" x2="166" y2="426" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="172" y="420" font-size="10" fill="#6366f1">(if flagged: END, status=pending)</text>

  <line x1="286" y1="404" x2="286" y2="426" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="166" y="432" width="100" height="36" rx="6" fill="#ffffff" stroke="#6366f1" />
    <text x="190" y="455" font-size="12" fill="#222">Writer</text>
  </g>
  <line x1="266" y1="450" x2="286" y2="450" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="286" y="432" width="100" height="36" rx="6" fill="#ffffff" stroke="#6366f1" />
    <text x="306" y="455" font-size="12" fill="#222">Critic</text>
  </g>
  <path d="M286,468 Q226,488 216,468" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="190" y="498" font-size="10" fill="#6366f1">revise loop (capped)</text>

  <!-- DeepSeek box -->
  <rect x="390" y="330" width="280" height="90" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" />
  <text x="406" y="352" font-size="13" font-weight="700" fill="#be185d">LLM provider</text>
  <circle cx="420" cy="378" r="12" fill="#db2777" />
  <text x="412" y="382" font-size="12" font-weight="700" fill="#fff">D</text>
  <text x="440" y="382" font-size="13" fill="#222">DeepSeek (v4-flash)</text>
  <text x="440" y="400" font-size="11" fill="#9d174d">fallback: deepseek-chat</text>

  <!-- Sandbox box -->
  <rect x="390" y="432" width="280" height="90" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="406" y="444" width="22" height="22" />
  <text x="436" y="460" font-size="13" font-weight="700" fill="#075985">sandbox (sibling containers)</text>
  <text x="406" y="480" font-size="11" fill="#0369a1">ephemeral python:3.12-slim</text>
  <text x="406" y="496" font-size="11" fill="#0369a1">no network, memory-capped</text>

  <!-- frontend box -->
  <rect x="740" y="280" width="360" height="260" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="756" y="292" width="26" height="26" />
  <text x="788" y="310" font-size="14" font-weight="700" fill="#222">frontend (React + Vite)</text>

  <g>
    <rect x="760" y="330" width="150" height="40" rx="6" fill="#ffffff" stroke="#06b6d4" />
    <text x="775" y="355" font-size="12" fill="#222">Jobs view</text>
  </g>
  <g>
    <rect x="760" y="380" width="150" height="40" rx="6" fill="#ffffff" stroke="#06b6d4" />
    <text x="775" y="405" font-size="12" fill="#222">Usage view</text>
  </g>
  <text x="760" y="450" font-size="11" fill="#0e7490">filter / flag / review / draft /</text>
  <text x="760" y="466" font-size="11" fill="#0e7490">approve-reject-redraft (HITL)</text>

  <!-- arrow backend <-> frontend -->
  <line x1="690" y1="402" x2="738" y2="402" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="738" y1="416" x2="690" y2="416" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="697" y="395" font-size="10" fill="#57606a">REST</text>

  <!-- arrow from LangGraph to DeepSeek -->
  <line x1="360" y1="386" x2="388" y2="386" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
